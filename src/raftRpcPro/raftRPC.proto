//用于raft之间的通信rpc

syntax = "proto3";
package raftRpcProctoc; //所在的命名空间
option cc_generic_services = true;  //开启stub服务

// 日志实体
message LogEntry{  
    bytes Command  =1;
	int32 LogTerm   =2;
	int32 LogIndex  = 3;
}

// 日志/心跳请求   由leader复制log条目，也可以当做是心跳连接，注释中的rf为leader节点
message AppendEntriesArgs  {
	int32 Term        =1;
	int32 LeaderId       =2;
	int32 PrevLogIndex =3;  //AppendEntries 的前一条 日志索引 用来给follower判断是否接受新的AE
	int32 PrevLogTerm  =4;
	repeated LogEntry Entries  = 5;  //日志实体容器 类似vector<LogEntry>  一段一段日志发送同步
	int32 LeaderCommit  = 6;  //leader已提交的最高日志索引
}

// 日志/心跳响应
message AppendEntriesReply {
	int32 Term =1;             // leader的term可能是与Follower不同的，
	bool Success = 2;          //日志是否匹配
	int32 UpdateNextIndex = 3;    //快速调整leader对应的nextIndex  （失败时的回退建议）
	int32 AppState = 4;  // 用来标识节点（网络）状态
}

//投票请求者投票请求args
message RequestVoteArgs  {
	int32 Term         =1;
	int32 CandidateId  =2;
	int32 LastLogIndex =3;
	int32 LastLogTerm  =4;
}

//投票者回复
message RequestVoteReply  {
	int32 Term        =1;
	bool VoteGranted  =2;
	int32 VoteState   =3;
}

//发送快照
message InstallSnapshotRequest  {
	int32 LeaderId                 =1;
	int32 Term                     =2;
	int32 LastSnapShotIncludeIndex =3;
	int32 LastSnapShotIncludeTerm  =4;
	bytes Data                     =5;  //快照信息，当然是用bytes来传递
}

// InstallSnapshotResponse 只用返回Term，因为对于快照只要Term是符合的就是无条件接受的
message InstallSnapshotResponse  {
	int32 Term  = 1;
}
