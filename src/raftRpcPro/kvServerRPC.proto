// 客户端Clerk 和KVServer 之间的RPC

syntax = "proto3";
package raftKVRpcProctoc; //所在的命名空间
option cc_generic_services = true;  //开启stub服务

// 日志实体
message GetArgs{
  bytes Key = 1 ;
  bytes ClientId = 2 ;
  int32 RequestId = 3;
}

message GetReply  {
  bytes Err = 1;
  bytes Value = 2;

}


// Put or Append
message PutAppendArgs  {
  bytes Key = 1;
  bytes  Value = 2 ;
  bytes  Op = 3;
  bytes  ClientId = 4;
  int32  RequestId = 5;
}

message PutAppendReply  {
  bytes Err = 1;
}

enum NodeRole {
  FOLLOWER = 0;
  CANDIDATE = 1;
  LEADER = 2;
}

message StatusArgs {}

message StatusReply {
  int32 node_id = 1;
  int32 term = 2;
  NodeRole role = 3;
  int32 commit_index = 4;
  int32 last_applied = 5;
  int32 snapshot_index = 6;
  int32 snapshot_term = 7;
}

service kvServerRpc
{
  rpc PutAppend(PutAppendArgs) returns(PutAppendReply);
  rpc Get (GetArgs) returns (GetReply);
  rpc GetStatus(StatusArgs) returns(StatusReply);
}

